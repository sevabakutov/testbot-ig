[package]
name = "testbot"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "testbot"
path = "src/bin/main.rs"

[dependencies]
actix-web = "4.11.0"
anyhow = "1.0.98"
async-openai = "0.29.0"
async-trait = "0.1.88"
hex = "0.4.3"
hmac = "0.12.1"
once_cell = "1.21.3"
reqwest = { version = "0.12.22", features = ["json"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
tokio = "1.46.1"
url = "2.5.4"
